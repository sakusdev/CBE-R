name: Verify v0.6.1 Release

on:
  push:
    branches:
      - "release/v0.6.1"

permissions:
  contents: write

jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, 'verify: record v0.6.1 release assets') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.6.1
      - name: Verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f release-v0.6.1.ok
          for attempt in $(seq 1 30); do
            if gh release view v0.6.1 --repo "$GITHUB_REPOSITORY" --json url,assets > /tmp/release.json 2>/dev/null; then
              count="$(jq '.assets | length' /tmp/release.json)"
              if [ "$count" -eq 12 ]; then
                jq -r '.url' /tmp/release.json > release-v0.6.1.ok
                jq -r '.assets[] | "\(.name)\t\(.size)"' /tmp/release.json | sort >> release-v0.6.1.ok
                break
              fi
            fi
            sleep 10
          done
          test -s release-v0.6.1.ok
          grep -q $'^cbe-r-gui-windows-x64.exe\t' release-v0.6.1.ok
          grep -q $'^cbe-r-windows-x64.exe\t' release-v0.6.1.ok
          grep -q $'^cbe-r-0.6.1.tgz\t' release-v0.6.1.ok
          grep -q $'^SHA256SUMS.txt\t' release-v0.6.1.ok
      - name: Record verification
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-v0.6.1.ok
          git commit -m "verify: record v0.6.1 release assets"
          git push origin HEAD:release/v0.6.1

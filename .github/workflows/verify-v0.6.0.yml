name: Verify v0.6.0 Release

on:
  push:
    branches:
      - "release/v0.6.0"

permissions:
  contents: write

jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[verify-marker]') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.6.0
      - name: Verify release and assets
        shell: bash
        run: |
          set -euo pipefail
          json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v0.6.0")"
          test "$(jq -r '.tag_name' <<<"$json")" = "v0.6.0"
          mapfile -t names < <(jq -r '.assets[].name' <<<"$json" | sort)
          expected=(
            SHA256SUMS.txt
            cbe-r-0.6.0.tgz
            cbe-r-gui-linux-arm64
            cbe-r-gui-linux-x64
            cbe-r-gui-macos-arm64
            cbe-r-gui-macos-x64
            cbe-r-gui-windows-x64.exe
            cbe-r-linux-arm64
            cbe-r-linux-x64
            cbe-r-macos-arm64
            cbe-r-macos-x64
            cbe-r-windows-x64.exe
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${names[@]}")
          jq -r '.html_url, (.assets[] | [.name, .size] | @tsv)' <<<"$json" > release-v0.6.0.ok
      - name: Publish verification marker
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- release-v0.6.0.ok
          git commit -m 'ci: [verify-marker] confirm v0.6.0 release'
          git push origin HEAD:release/v0.6.0
